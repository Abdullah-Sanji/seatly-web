name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The web app is checked against the API branch of the same story when one exists
# (feat/SEAT-12-fe -> feat/SEAT-12-be), otherwise against seatly-api main.
env:
  SEATLY_API_REPO: Abdullah-Sanji/seatly-api

jobs:
  resolve-api-ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        run: |
          head="${{ github.head_ref || github.ref_name }}"
          candidate="${head%-fe}-be"
          if [ "$candidate" != "$head" ] && git ls-remote --exit-code --heads "https://github.com/${SEATLY_API_REPO}.git" "$candidate" >/dev/null 2>&1; then
            echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: resolve-api-ref
    timeout-minutes: 15
    defaults:
      run:
        working-directory: seatly-web
    steps:
      - uses: actions/checkout@v4
        with:
          path: seatly-web
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SEATLY_API_REPO }}
          ref: ${{ needs.resolve-api-ref.outputs.ref }}
          path: seatly-api
          token: ${{ secrets.SEATLY_API_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: seatly-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match the contract
        run: pnpm api:types:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: resolve-api-ref
    timeout-minutes: 25
    defaults:
      run:
        working-directory: seatly-web
    steps:
      - uses: actions/checkout@v4
        with:
          path: seatly-web
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SEATLY_API_REPO }}
          ref: ${{ needs.resolve-api-ref.outputs.ref }}
          path: seatly-api
          token: ${{ secrets.SEATLY_API_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: seatly-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser e2e against the full Docker stack
        run: pnpm e2e:fresh
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: seatly-web/playwright-report
      - name: Stack logs
        if: failure()
        run: docker compose -p seatly-e2e -f ../seatly-api/docker-compose.yml --profile full logs --no-color | tail -200
